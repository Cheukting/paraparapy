[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "ruff-check", name = "ruff check", entry = "uv run ruff check", language = "system", pass_filenames = false },
  { id = "ruff-format", name = "ruff format", entry = "uv run ruff format --check", language = "system", pass_filenames = false },
  { id = "pyrefly-check", name = "pyrefly check", entry = "uv run pyrefly check", language = "system", pass_filenames = false },
  { id = "pytest", name = "pytest (affected tests)", entry = "uv run pytest -q --testmon", language = "system", pass_filenames = false },
  { id = "pip-audit", name = "pip-audit", entry = "bash -c 'uv run pip-audit -r <(uv export --format requirements-txt --no-header --no-annotate --no-hashes) || uv run pip-audit'", language = "system", pass_filenames = false },
]

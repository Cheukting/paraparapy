name: Build

on:
  push:
    branches: [main, startup-performance]

permissions:
  contents: read
  actions: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Install PyInstaller
        run: uv pip install pyinstaller
      - name: Build macOS app
        run: uv run pyinstaller paraparapy.spec
      - name: Verify bundle structure
        run: |
          test -d dist/ParaParaPy.app
          test -f dist/ParaParaPy.app/Contents/Info.plist
          test -f dist/ParaParaPy.app/Contents/MacOS/ParaParaPy
          test "$(du -sk dist/ParaParaPy.app/Contents/Frameworks | cut -f1)" -gt 0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParaParaPy-macos.app
          path: dist/ParaParaPy.app
          retention-days: 30

[project]
name = "paraparapy"
version = "0.1.0"
description = "ParaParaPy: desktop Para Para dance game with webcam pose tracking and rhythm scoring"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Cheukting", email = "cheukting.ho@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[project.scripts]
parapara = "parapara:main"
parapara-capture-debug = "parapara.game.debug_view:main"
parapara-capture-bench = "parapara.game.capture_bench:main"
parapara-record = "parapara.game.recorder:main"
parapara-latency-test = "parapara.game.latency_check:main"
parapara-analyze = "parapara.diagnostics.pose_analysis:main"
parapara-tune-filters = "parapara.diagnostics.filter_tuning:main"
parapara-score = "parapara.diagnostics.score_clips:main"
parapara-beatmap = "parapara.audio.beatmap:main"
parapara-beatcheck = "parapara.game.beatcheck:main"
parapara-import-song = "parapara.audio.importer:main"
parapara-find-songs = "parapara.audio.find_songs:main"
parapara-fetch-demo-songs = "parapara.audio.fetch_demo_songs:main"
parapara-routines = "parapara.routine.cli:main"
parapara-preview = "parapara.game.preview:main"
parapara-play = "parapara.game.app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The project is ParaParaPy; the import package keeps the short name.
module-name = "parapara"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "pyrefly>=1.4.0",
    "prek>=0.0.28",
    "pip-audit>=2.9.0",
]
tools = [
    "librosa>=1.0.0",
]

[tool.pytest]
# Only tests/ holds tests: without this, pytest also imports src/ modules
# matching *_test.py, which pulled pygame into the test process (where cv2 is
# loaded too; see tests/conftest.py).
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/tests/**", "**/__pycache__/**"]

[tool.uv]
# librosa (beat-map tools) is needed for development and tests, not to play the game.
default-groups = ["dev", "tools"]
